{% extends "dashboard.html" %}

{% block addcss %}<link rel="stylesheet" href="{{ url_for('static', filename='addnotes.css') }}">{% endblock %}
{% block content %}
    <div class="container">
        <h2 style="text-align: center; margin-bottom: 10px; margin-top: 10px;">Update Note</h2>
        <form method="POST">
            <div class="form-group">
                <label for="title">Note Title:</label>
                <input type="text" class="form-control" id="title" name="title" value="{{ data[1] }}" required>
            </div>
            <div class="form-group">
                <label for="content">Note Content:</label>
                <textarea class="form-control" id="content" name="content" rows="5" required>{{ data[2] }}</textarea>
            </div>
            <button type="submit" class="btn btn-primary">Update Note</button>
        </form>
    </div>
{% endblock %}
