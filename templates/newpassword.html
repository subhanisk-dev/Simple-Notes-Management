<!DOCTYPE html>
<html>
<head>
    <title>Reset Password</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f6f8;
        }

        .reset-container {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 10px;
            color: #333;
        }

        .description {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            color: #333;
            font-size: 14px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #4a90e2;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 7px;
            background: #4a90e2;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 5px;
        }

        button:hover {
            background: #357abd;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .login-link {
            display: none;
            text-align: center;
            margin-top: 15px;
        }

        .login-link a {
            color: #4a90e2;
            text-decoration: none;
            font-size: 14px;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="reset-container">
        <h2>Reset Password</h2>
        <p class="description">
            Enter your new password below.
        </p>

        <form id="passwordForm">
            <div class="form-group">
                <label for="password">
                    New Password
                </label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter Password"
                    required
                >
            </div>

            <div class="form-group">
                <label for="cpassword">
                    Confirm Password
                </label>
                <input
                    type="password"
                    id="cpassword"
                    placeholder="Confirm Password"
                    required
                >
            </div>

            <button type="submit">
                Update Password
            </button>
        </form>

        <p id="message"></p>

        <!-- Hidden initially -->
        <div id="loginLink" class="login-link">
            <a href="/login">Go to Login</a>
        </div>
    </div>

    <script>
        // Flask backend value
        const token = "{{ token }}";
        document.getElementById("passwordForm").addEventListener(
            "submit",
            async function(event) {
                // Prevent normal form submission
                event.preventDefault();
                // Get password values
                const password =
                    document.getElementById("password").value;

                const cpassword =
                    document.getElementById("cpassword").value;

                // Check whether passwords match
                if (password !== cpassword) {
                    document.getElementById("message").innerText =
                        "Passwords do not match";
                    return;
                }

                try {
                    // Send request to Flask backend
                    const response = await fetch(
                        `/newpassword/${encodeURIComponent(token)}`,
                        {
                            method: "PUT",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({
                                password: password,
                                cpassword: cpassword
                            })
                        }
                    );

                    // Get response from Flask
                    const data = await response.json();

                    // Display Flask message
                    document.getElementById("message").innerText =
                        data.message;

                    // If password update was successful
                    if (response.ok) {
                        // Show Login link
                        document.getElementById("loginLink").style.display =
                            "block";
                    }
                }

                catch (error) {
                    console.error(error);
                    document.getElementById("message").innerText =
                        "Something went wrong";
                }
            }
        );
    </script>
</body>
</html>
