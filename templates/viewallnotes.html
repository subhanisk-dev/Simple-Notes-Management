{% extends "dashboard.html" %}
{% block title %}<title>Notes</title>
{% endblock %}
    {% block addcss %}<link rel="stylesheet" href="{{ url_for('static', filename='viewallnotes.css') }}">{% endblock %}
    {% block content %}
    <main class="notes-page">
        <div class="notes-container">
            <h1 class="notes-heading">Notes</h1>
            <div class="notes-table-wrapper">
                <table class="notes-table">
                    <thead class="notes-table-head">
                        <tr class="notes-table-row">
                            <th class="notes-table-header notes-id-column">Note ID</th>
                            <th class="notes-table-header">Note Title</th>
                            <th class="notes-table-header notes-date-column">Created At</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for i in notes_data %}
                        <tr class="notes-table-row">
                            <td class="notes-table-data notes-id-column">{{i[0]}}</td>
                            <td class="notes-table-data notes-heading-column">{{i[1]}}</td>
                            <td class="notes-table-data notes-date-column">{{i[2]}}</td>
                            <a href="#">
                                <td>View</td>
                            </a>
                            <a href="#">
                                <td>Update</td>
                            </a>
                            <a href="#">
                                <td>Delete</td>
                            </a>
                        </tr>
                        {% endfor %}
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
{% endblock %}
